# Push a tag like v0.1.0 to build parinfer-lsp for each platform and attach it
# to a GitHub release. The extension downloads it from there.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      # Static Linux binaries, so they run on older distributions too.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          name=parinfer-lsp-${{ matrix.target }}
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" parinfer-lsp.exe
            gh release upload "$GITHUB_REF_NAME" "$name.zip"
          else
            tar czf "$name.tar.gz" parinfer-lsp
            gh release upload "$GITHUB_REF_NAME" "$name.tar.gz"
          fi
